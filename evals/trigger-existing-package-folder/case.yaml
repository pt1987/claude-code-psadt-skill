# context.* is case.yaml-only. It was previously written into prompt.md, where the loader rejects it
# with `unknown frontmatter key "context"`, so this case never loaded and never ran. Everything else
# stays in prompt.md, the same shape the other twenty cases use.
schema_version: "1.1"
name: trigger-existing-package-folder
context:
  scaffold_script: fixture.sh
